server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — send all paths to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted assets (Vite adds content hashes)
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        image/svg+xml;
}
